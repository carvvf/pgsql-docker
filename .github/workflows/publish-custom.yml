name: Publish custom image
run-name: Publish source-built PostgreSQL image

on:
  workflow_dispatch:
    inputs:
      postgres_upstream_ref:
        description: Optional immutable postgres:18 reference; empty resolves postgres:18
        required: false
        default: ''
      postgres_upstream_version:
        description: Optional PostgreSQL version; empty resolves postgres:18's PG_VERSION
        required: false
        default: ''
      postgres_upstream_digest:
        description: Optional official-image manifest digest
        required: false
        default: ''
      postgres_source_ref:
        description: Optional PostgreSQL source tag; empty derives REL_<major>_<minor>
        required: false
        default: ''
      postgres_source_revision:
        description: Optional PostgreSQL source commit; empty resolves the source tag
        required: false
        default: ''
      gosu_source_ref:
        description: Optional gosu source tag; empty resolves postgres:18's GOSU_VERSION
        required: false
        default: ''
      gosu_source_revision:
        description: Optional gosu source commit; empty resolves the source tag
        required: false
        default: ''
      entrypoint_source_commit:
        description: Optional docker-library/postgres commit; empty resolves current master
        required: false
        default: ''
      ubuntu_base_ref:
        description: Optional immutable Ubuntu runtime reference; empty resolves ubuntu:24.04
        required: false
        default: ''
      ubuntu_base_digest:
        description: Optional Ubuntu manifest digest
        required: false
        default: ''
  workflow_call:
    inputs:
      postgres_upstream_ref:
        required: false
        type: string
        default: ''
      postgres_upstream_version:
        required: false
        type: string
        default: ''
      postgres_upstream_digest:
        required: false
        type: string
        default: ''
      postgres_source_ref:
        required: false
        type: string
        default: ''
      postgres_source_revision:
        required: false
        type: string
        default: ''
      gosu_source_ref:
        required: false
        type: string
        default: ''
      gosu_source_revision:
        required: false
        type: string
        default: ''
      entrypoint_source_commit:
        required: false
        type: string
        default: ''
      ubuntu_base_ref:
        required: false
        type: string
        default: ''
      ubuntu_base_digest:
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: pgsql-image-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      version: ${{ steps.resolve.outputs.version }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      upstream_version: ${{ steps.resolve.outputs.upstream_version }}
      upstream_digest: ${{ steps.resolve.outputs.upstream_digest }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      source_revision: ${{ steps.resolve.outputs.source_revision }}
      gosu_source_ref: ${{ steps.resolve.outputs.gosu_source_ref }}
      gosu_source_revision: ${{ steps.resolve.outputs.gosu_source_revision }}
      entrypoint_source_commit: ${{ steps.resolve.outputs.entrypoint_source_commit }}
      ubuntu_base_ref: ${{ steps.resolve.outputs.ubuntu_base_ref }}
      ubuntu_base_digest: ${{ steps.resolve.outputs.ubuntu_base_digest }}

    steps:
      # PostgreSQL's on-disk format is not compatible across major versions
      # (see AGENTS.md "Version and upgrade policy"). Pulling the
      # major-pinned "postgres:18" tag, rather than "postgres:latest",
      # structurally prevents this workflow from ever auto-resolving a PG19
      # candidate: moving to a new major version requires a deliberate edit
      # to this pinned tag, not just a rerun.
      - name: Resolve upstream release, source revisions, Ubuntu base, and custom version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_REF: ${{ inputs.postgres_upstream_ref }}
          INPUT_UPSTREAM_VERSION: ${{ inputs.postgres_upstream_version }}
          INPUT_UPSTREAM_DIGEST: ${{ inputs.postgres_upstream_digest }}
          INPUT_SOURCE_REF: ${{ inputs.postgres_source_ref }}
          INPUT_SOURCE_REVISION: ${{ inputs.postgres_source_revision }}
          INPUT_GOSU_SOURCE_REF: ${{ inputs.gosu_source_ref }}
          INPUT_GOSU_SOURCE_REVISION: ${{ inputs.gosu_source_revision }}
          INPUT_ENTRYPOINT_SOURCE_COMMIT: ${{ inputs.entrypoint_source_commit }}
          INPUT_UBUNTU_BASE_REF: ${{ inputs.ubuntu_base_ref }}
          INPUT_UBUNTU_BASE_DIGEST: ${{ inputs.ubuntu_base_digest }}
        run: |
          set -euo pipefail

          upstream_ref="${INPUT_UPSTREAM_REF}"
          upstream_version="${INPUT_UPSTREAM_VERSION}"
          upstream_digest="${INPUT_UPSTREAM_DIGEST}"
          gosu_source_ref="${INPUT_GOSU_SOURCE_REF}"
          if [ -z "${upstream_ref}" ] || [ -z "${gosu_source_ref}" ]; then
            docker pull postgres:18
            env_json="$(docker image inspect postgres:18 --format '{{json .Config.Env}}')"
            pg_version_full="$(jq -r '.[] | select(startswith("PG_VERSION="))' <<<"${env_json}" | cut -d= -f2-)"
            if [ -z "${upstream_ref}" ]; then
              upstream_digest="$(docker image inspect postgres:18 --format '{{index .RepoDigests 0}}')"
              upstream_digest="${upstream_digest##*@}"
              upstream_version="${pg_version_full%%-*}"
              upstream_ref="postgres@${upstream_digest}"
            fi
            if [ -z "${gosu_source_ref}" ]; then
              gosu_source_ref="$(jq -r '.[] | select(startswith("GOSU_VERSION="))' <<<"${env_json}" | cut -d= -f2-)"
            fi
          fi

          if [ -z "${upstream_version}" ] || [ -z "${upstream_digest}" ] || [ "${upstream_digest}" = 'unknown' ]; then
            echo 'An official PostgreSQL version and immutable manifest digest are required.' >&2
            exit 1
          fi
          if [[ ! "${upstream_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid PostgreSQL manifest digest: ${upstream_digest}" >&2
            exit 1
          fi
          if [[ ! "${upstream_version}" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unsupported PostgreSQL version format: ${upstream_version}" >&2
            exit 1
          fi
          pg_major="${BASH_REMATCH[1]}"
          pg_minor="${BASH_REMATCH[2]}"

          source_ref="${INPUT_SOURCE_REF:-REL_${pg_major}_${pg_minor}}"
          source_revision_from_tag="$(git ls-remote https://github.com/postgres/postgres.git "refs/tags/${source_ref}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "${source_revision_from_tag}" ]; then
            source_revision_from_tag="$(git ls-remote https://github.com/postgres/postgres.git "refs/tags/${source_ref}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ ! "${source_revision_from_tag}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Could not resolve PostgreSQL source tag: ${source_ref}" >&2
            exit 1
          fi
          source_revision="${INPUT_SOURCE_REVISION:-${source_revision_from_tag}}"
          if [ "${source_revision}" != "${source_revision_from_tag}" ]; then
            echo "Source revision does not match ${source_ref}: ${source_revision}" >&2
            exit 1
          fi

          gosu_source_revision_from_tag="$(git ls-remote https://github.com/tianon/gosu.git "refs/tags/${gosu_source_ref}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "${gosu_source_revision_from_tag}" ]; then
            gosu_source_revision_from_tag="$(git ls-remote https://github.com/tianon/gosu.git "refs/tags/${gosu_source_ref}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ ! "${gosu_source_revision_from_tag}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Could not resolve gosu source tag: ${gosu_source_ref}" >&2
            exit 1
          fi
          gosu_source_revision="${INPUT_GOSU_SOURCE_REVISION:-${gosu_source_revision_from_tag}}"
          if [ "${gosu_source_revision}" != "${gosu_source_revision_from_tag}" ]; then
            echo "gosu source revision does not match ${gosu_source_ref}: ${gosu_source_revision}" >&2
            exit 1
          fi

          # docker-library/postgres does not tag releases; pin the current
          # master commit instead (or the caller-supplied override).
          entrypoint_source_commit="${INPUT_ENTRYPOINT_SOURCE_COMMIT}"
          if [ -z "${entrypoint_source_commit}" ]; then
            entrypoint_source_commit="$(git ls-remote https://github.com/docker-library/postgres.git refs/heads/master | awk 'NR == 1 { print $1 }')"
          fi
          if [[ ! "${entrypoint_source_commit}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Could not resolve docker-library/postgres entrypoint commit." >&2
            exit 1
          fi

          ubuntu_base_ref="${INPUT_UBUNTU_BASE_REF}"
          ubuntu_base_digest="${INPUT_UBUNTU_BASE_DIGEST}"
          if [ -z "${ubuntu_base_ref}" ]; then
            docker pull ubuntu:24.04
            ubuntu_base_digest="$(docker image inspect ubuntu:24.04 --format '{{index .RepoDigests 0}}')"
            ubuntu_base_digest="${ubuntu_base_digest##*@}"
            ubuntu_base_ref="ubuntu@${ubuntu_base_digest}"
          fi
          if [ -z "${ubuntu_base_digest}" ] || [ "${ubuntu_base_digest}" = 'unknown' ]; then
            echo 'An immutable Ubuntu runtime manifest digest is required.' >&2
            exit 1
          fi
          if [[ ! "${ubuntu_base_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid Ubuntu manifest digest: ${ubuntu_base_digest}" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          owner_lc="$(printf '%s' "${owner}" | tr '[:upper:]' '[:lower:]')"
          package_name="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${owner_lc}/${package_name}"
          escaped_upstream_version="${upstream_version//./\\.}"

          owner_type="$(gh api -H 'Accept: application/vnd.github+json' "/users/${owner}" --jq '.type')"
          if [ "${owner_type}" = 'Organization' ]; then
            package_scope="/orgs/${owner}"
          else
            package_scope="/users/${owner}"
          fi

          latest_n=''
          set +e
          versions_json="$(gh api -H 'Accept: application/vnd.github+json' "${package_scope}/packages/container/${package_name}/versions?per_page=100" 2>/tmp/pgsql-ghcr-versions.err)"
          versions_status=$?
          set -e
          if [ "${versions_status}" -eq 0 ]; then
            latest_n="$(
              jq -r '
                .[]
                | .metadata.container.tags // []
                | select(index("latest"))
                | .[]
              ' <<<"${versions_json}" \
                | sed -nE "s/^${escaped_upstream_version}-custom\\.([0-9]+)$/\\1/p" \
                | sort -n \
                | tail -n1
            )"
          elif grep -q '404' /tmp/pgsql-ghcr-versions.err; then
            echo 'GHCR package does not exist yet; this is the bootstrap publication.'
          else
            cat /tmp/pgsql-ghcr-versions.err >&2
            exit "${versions_status}"
          fi

          if [ -z "${latest_n}" ]; then
            next_n=1
            previous_version='none'
          else
            next_n=$((latest_n + 1))
            previous_version="${upstream_version}-custom.${latest_n}"
          fi
          version="${upstream_version}-custom.${next_n}"

          {
            echo "image_ref=${image_ref}"
            echo "version=${version}"
            echo "upstream_ref=${upstream_ref}"
            echo "upstream_version=${upstream_version}"
            echo "upstream_digest=${upstream_digest}"
            echo "source_ref=${source_ref}"
            echo "source_revision=${source_revision}"
            echo "gosu_source_ref=${gosu_source_ref}"
            echo "gosu_source_revision=${gosu_source_revision}"
            echo "entrypoint_source_commit=${entrypoint_source_commit}"
            echo "ubuntu_base_ref=${ubuntu_base_ref}"
            echo "ubuntu_base_digest=${ubuntu_base_digest}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '## Custom image preflight'
            echo "- Official PostgreSQL release signal: ${upstream_ref}"
            echo "- PostgreSQL source: ${source_ref}@${source_revision}"
            echo "- gosu source: ${gosu_source_ref}@${gosu_source_revision}"
            echo "- Entrypoint source: docker-library/postgres@${entrypoint_source_commit}"
            echo "- Ubuntu runtime base: ${ubuntu_base_ref}"
            echo "- Previous custom version: ${previous_version}"
            echo "- New custom version: ${version}"
            echo "- Target: ${image_ref}:${version}"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    needs: preflight
    uses: ./.github/workflows/build-custom.yml
    with:
      image_tag_suffix: ${{ needs.preflight.outputs.version }}
      postgres_source_ref: ${{ needs.preflight.outputs.source_ref }}
      postgres_source_revision: ${{ needs.preflight.outputs.source_revision }}
      postgres_upstream_version: ${{ needs.preflight.outputs.upstream_version }}
      postgres_upstream_digest: ${{ needs.preflight.outputs.upstream_digest }}
      gosu_source_ref: ${{ needs.preflight.outputs.gosu_source_ref }}
      gosu_source_revision: ${{ needs.preflight.outputs.gosu_source_revision }}
      entrypoint_source_commit: ${{ needs.preflight.outputs.entrypoint_source_commit }}
      ubuntu_base_ref: ${{ needs.preflight.outputs.ubuntu_base_ref }}
      ubuntu_base_digest: ${{ needs.preflight.outputs.ubuntu_base_digest }}
    permissions:
      contents: read

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=pgsql-source-amd64
          cache-to: type=gha,mode=max,scope=pgsql-source-amd64
          tags: |
            ${{ needs.preflight.outputs.image_ref }}:${{ needs.preflight.outputs.version }}
            ${{ needs.preflight.outputs.image_ref }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            io.github.carvvf.pgsql-docker.postgres.source.ref=${{ needs.preflight.outputs.source_ref }}
            io.github.carvvf.pgsql-docker.postgres.source.revision=${{ needs.preflight.outputs.source_revision }}
            io.github.carvvf.pgsql-docker.postgres.upstream.digest=${{ needs.preflight.outputs.upstream_digest }}
            io.github.carvvf.pgsql-docker.gosu.source.ref=${{ needs.preflight.outputs.gosu_source_ref }}
            io.github.carvvf.pgsql-docker.gosu.source.revision=${{ needs.preflight.outputs.gosu_source_revision }}
            io.github.carvvf.pgsql-docker.entrypoint.source.commit=${{ needs.preflight.outputs.entrypoint_source_commit }}
            io.github.carvvf.pgsql-docker.runtime.base.name=ubuntu:24.04
            io.github.carvvf.pgsql-docker.runtime.base.digest=${{ needs.preflight.outputs.ubuntu_base_digest }}
          build-args: |
            POSTGRES_SOURCE_REF=${{ needs.preflight.outputs.source_ref }}
            POSTGRES_SOURCE_REVISION=${{ needs.preflight.outputs.source_revision }}
            POSTGRES_UPSTREAM_VERSION=${{ needs.preflight.outputs.upstream_version }}
            POSTGRES_UPSTREAM_DIGEST=${{ needs.preflight.outputs.upstream_digest }}
            GOSU_SOURCE_REF=${{ needs.preflight.outputs.gosu_source_ref }}
            GOSU_SOURCE_REVISION=${{ needs.preflight.outputs.gosu_source_revision }}
            ENTRYPOINT_SOURCE_COMMIT=${{ needs.preflight.outputs.entrypoint_source_commit }}
            UBUNTU_BASE_IMAGE=${{ needs.preflight.outputs.ubuntu_base_ref }}
            UBUNTU_BASE_DIGEST=${{ needs.preflight.outputs.ubuntu_base_digest }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            CACHEBUST=${{ github.run_id }}

      - name: Verify the published linux/amd64 manifest
        run: |
          set -euo pipefail
          image='${{ needs.preflight.outputs.image_ref }}:${{ needs.preflight.outputs.version }}'
          docker buildx imagetools inspect "${image}"
          # Excludes non-platform entries such as the provenance/SBOM
          # attestation manifest that buildx attaches to the index.
          docker buildx imagetools inspect --raw "${image}" \
            | jq -e '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
                | length == 1
              ' >/dev/null

      - name: Publish summary
        run: |
          {
            echo '## Publish result'
            echo '- Published platform: linux/amd64'
            echo '- Published image: ${{ needs.preflight.outputs.image_ref }}:${{ needs.preflight.outputs.version }}'
            echo '- Mutable tag: ${{ needs.preflight.outputs.image_ref }}:latest'
            echo '- PostgreSQL source: ${{ needs.preflight.outputs.source_ref }}@${{ needs.preflight.outputs.source_revision }}'
            echo '- gosu source: ${{ needs.preflight.outputs.gosu_source_ref }}@${{ needs.preflight.outputs.gosu_source_revision }}'
            echo '- Entrypoint source: docker-library/postgres@${{ needs.preflight.outputs.entrypoint_source_commit }}'
            echo '- Ubuntu base: ${{ needs.preflight.outputs.ubuntu_base_ref }}'
          } >> "${GITHUB_STEP_SUMMARY}"
