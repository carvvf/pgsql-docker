name: Retention cleanup
run-name: Retention cleanup

on:
  schedule:
    # UTC schedule; Europe/Rome: Sunday 23:57 CET / Monday 00:57 CEST.
    - cron: '57 22 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report candidates without deleting them
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  cleanup-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old GHCR versions while retaining rollback images
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_DAYS: '60'
          RETAIN_CUSTOM_VERSIONS: '10'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER}"
          package_name="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          owner_type="$(gh api -H 'Accept: application/vnd.github+json' "/users/${owner}" --jq '.type')"
          if [ "${owner_type}" = 'Organization' ]; then
            package_scope="/orgs/${owner}"
          else
            package_scope="/users/${owner}"
          fi
          cutoff_epoch="$(date -u -d "${RETENTION_DAYS} days ago" +%s)"

          set +e
          # Every page: the listing is newest first, so the oldest versions, the ones the
          # policy deletes, are on the last pages.
          versions_json="$(
            gh api --paginate -H 'Accept: application/vnd.github+json' \
              "${package_scope}/packages/container/${package_name}/versions?per_page=100" \
              2>/tmp/pgsql-ghcr-retention.err | jq -s 'add // []'
          )"
          versions_status=$?
          set -e
          if [ "${versions_status}" -ne 0 ]; then
            if grep -q '404' /tmp/pgsql-ghcr-retention.err; then
              echo 'GHCR package does not exist yet; nothing to clean.'
              exit 0
            fi
            cat /tmp/pgsql-ghcr-retention.err >&2
            exit "${versions_status}"
          fi

          scanned=0
          kept=0
          deleted=0
          candidates=0
          retained_version_ids="$(
            jq -r '
              [
                .[]
                | select((.metadata.container.tags // []) | any(test("-custom\\.[0-9]+$")))
                | {id: .id, updated_at: (.updated_at // .created_at // "")}
              ]
              | sort_by(.updated_at)
              | reverse
              | .[0:env.RETAIN_CUSTOM_VERSIONS | tonumber][]
              | .id
            ' <<<"${versions_json}"
          )"
          # Each tag names an OCI index whose platform and attestation manifests GHCR lists
          # as separate untagged versions; deleting them breaks the tag that is kept.
          referenced_digests=''
          keep_reason() {
            local version="$1" version_id updated_at
            version_id="$(jq -r '.id' <<<"${version}")"
            updated_at="$(jq -r '.updated_at // .created_at // ""' <<<"${version}")"
            if jq -e '(.metadata.container.tags // []) | index("latest") != null' <<<"${version}" >/dev/null; then
              echo contains-latest
            elif grep -Fxq "${version_id}" <<<"${retained_version_ids}"; then
              echo rollback-retention
            elif grep -Fxq "$(jq -r '.name' <<<"${version}")" <<<"${referenced_digests}"; then
              echo referenced-by-kept-tag
            elif [ -z "${updated_at}" ] || [ "$(date -u -d "${updated_at}" +%s)" -ge "${cutoff_epoch}" ]; then
              echo within-retention-or-missing-timestamp
            fi
          }

          # The index of every kept tag is read from the registry; any failure stops the job
          # before anything is deleted.
          owner_lc="$(printf '%s' "${owner}" | tr '[:upper:]' '[:lower:]')"
          registry_token="$(
            curl -fsS -u "${GITHUB_ACTOR:-token}:${GH_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${owner_lc}/${package_name}:pull" \
              | jq -er '.token'
          )"
          while IFS= read -r version; do
            [ -n "$(keep_reason "${version}")" ] || continue
            digest="$(jq -r '.name' <<<"${version}")"
            manifest="$(
              curl -fsS -H "Authorization: Bearer ${registry_token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${owner_lc}/${package_name}/manifests/${digest}"
            )"
            children="$(jq -r '.manifests[]?.digest' <<<"${manifest}")"
            if [ -n "${children}" ]; then
              referenced_digests="$(printf '%s\n%s' "${referenced_digests}" "${children}")"
            fi
          done < <(jq -c '.[] | select((.metadata.container.tags // []) | length > 0)' <<<"${versions_json}")

          while IFS= read -r version; do
            scanned=$((scanned + 1))
            version_id="$(jq -r '.id' <<<"${version}")"
            updated_at="$(jq -r '.updated_at // .created_at // ""' <<<"${version}")"
            tags="$(jq -r '(.metadata.container.tags // []) | join(",")' <<<"${version}")"

            reason="$(keep_reason "${version}")"
            if [ -n "${reason}" ]; then
              kept=$((kept + 1))
              echo "KEEP id=${version_id} tags=[${tags}] reason=${reason}"
              continue
            fi

            candidates=$((candidates + 1))
            if [ "${DRY_RUN}" = 'true' ]; then
              echo "DRY-RUN id=${version_id} tags=[${tags}] updated_at=${updated_at}"
              continue
            fi
            gh api --method DELETE -H 'Accept: application/vnd.github+json' \
              "${package_scope}/packages/container/${package_name}/versions/${version_id}" >/dev/null
            deleted=$((deleted + 1))
            echo "DELETE id=${version_id} tags=[${tags}] updated_at=${updated_at}"
          done < <(jq -c '.[]' <<<"${versions_json}")

          {
            echo '## GHCR retention result'
            echo "- Retention days: ${RETENTION_DAYS}"
            echo "- Custom versions retained for rollback: ${RETAIN_CUSTOM_VERSIONS}"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Versions scanned: ${scanned}"
            echo "- Versions kept: ${kept}"
            echo "- Versions matching deletion policy: ${candidates}"
            echo "- Versions deleted: ${deleted}"
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup-workflow-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed workflow runs older than 60 days
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_DAYS: '60'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          cutoff_epoch="$(date -u -d "${RETENTION_DAYS} days ago" +%s)"
          deleted=0
          candidates=0
          # Only runs older than the cutoff, on every page; the newest-first first page of
          # all runs holds fewer than 60 days once the repository runs daily.
          cutoff_date="$(date -u -d "@${cutoff_epoch}" +%Y-%m-%d)"
          runs_json="$(
            gh api --paginate -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&created=%3C${cutoff_date}" \
              | jq -s '{workflow_runs: map(.workflow_runs[])}'
          )"

          while IFS= read -r run; do
            status="$(jq -r '.status' <<<"${run}")"
            created_at="$(jq -r '.created_at' <<<"${run}")"
            run_id="$(jq -r '.id' <<<"${run}")"
            if [ "${status}" != 'completed' ] || [ "$(date -u -d "${created_at}" +%s)" -ge "${cutoff_epoch}" ]; then
              continue
            fi
            candidates=$((candidates + 1))
            if [ "${DRY_RUN}" = 'true' ]; then
              echo "DRY-RUN run_id=${run_id} created_at=${created_at}"
              continue
            fi
            gh api --method DELETE -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null
            deleted=$((deleted + 1))
            echo "DELETE run_id=${run_id} created_at=${created_at}"
          done < <(jq -c '.workflow_runs[] | select(.status == "completed")' <<<"${runs_json}")

          {
            echo '## Workflow-run retention result'
            echo "- Retention days: ${RETENTION_DAYS}"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Runs matching deletion policy: ${candidates}"
            echo "- Runs deleted: ${deleted}"
          } >> "${GITHUB_STEP_SUMMARY}"
