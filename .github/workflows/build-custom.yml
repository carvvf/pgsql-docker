name: Build custom image
run-name: Build and scan source-built PostgreSQL image

on:
  workflow_dispatch:
    inputs:
      image_tag_suffix:
        description: Optional suffix for the local candidate tag
        required: false
        default: ''
      postgres_source_ref:
        description: Optional PostgreSQL major 18 release tag; empty follows postgres:18
        required: false
        default: ''
      postgres_source_revision:
        description: Optional immutable commit expected for the source tag
        required: false
        default: ''
      postgres_upstream_version:
        description: Optional PostgreSQL major 18 version; verified against the official image
        required: false
        default: ''
      postgres_upstream_digest:
        description: Optional postgres:18 manifest digest for provenance
        required: false
        default: ''
      gosu_source_ref:
        description: Optional gosu release tag; empty uses the official image metadata
        required: false
        default: ''
      gosu_source_revision:
        description: Optional immutable commit expected for the gosu tag
        required: false
        default: ''
      entrypoint_source_commit:
        description: docker-library/postgres commit to vendor the entrypoint from
        required: false
        default: ''
      ubuntu_base_ref:
        description: Ubuntu runtime reference; prefer an immutable digest
        required: false
        default: ''
      ubuntu_base_digest:
        description: Optional Ubuntu manifest digest for provenance
        required: false
        default: ''
  workflow_call:
    inputs:
      image_tag_suffix:
        required: true
        type: string
      postgres_source_ref:
        required: true
        type: string
      postgres_source_revision:
        required: true
        type: string
      postgres_upstream_version:
        required: true
        type: string
      postgres_upstream_digest:
        required: true
        type: string
      gosu_source_ref:
        required: true
        type: string
      gosu_source_revision:
        required: true
        type: string
      go_toolchain_version:
        required: false
        type: string
        default: ''
      go_toolchain_sha256:
        required: false
        type: string
        default: ''
      entrypoint_source_commit:
        required: true
        type: string
      ubuntu_base_ref:
        required: true
        type: string
      ubuntu_base_digest:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TRIVY_DISABLE_TELEMETRY: 'true'
  TRIVY_SKIP_VERSION_CHECK: 'true'

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Check shared build input resolution
        run: python3 -m unittest discover -s tests -p test_build_inputs.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Resolve verified build inputs
        id: build_inputs
        env:
          POSTGRES_SOURCE_REF: ${{ inputs.postgres_source_ref }}
          POSTGRES_SOURCE_REVISION: ${{ inputs.postgres_source_revision }}
          POSTGRES_UPSTREAM_VERSION: ${{ inputs.postgres_upstream_version }}
          POSTGRES_UPSTREAM_DIGEST: ${{ inputs.postgres_upstream_digest }}
          GOSU_SOURCE_REF: ${{ inputs.gosu_source_ref }}
          GOSU_SOURCE_REVISION: ${{ inputs.gosu_source_revision }}
          GO_TOOLCHAIN_VERSION: ${{ inputs.go_toolchain_version }}
          GO_TOOLCHAIN_SHA256: ${{ inputs.go_toolchain_sha256 }}
          ENTRYPOINT_SOURCE_COMMIT: ${{ inputs.entrypoint_source_commit }}
          UBUNTU_BASE_IMAGE: ${{ inputs.ubuntu_base_ref }}
          UBUNTU_BASE_DIGEST: ${{ inputs.ubuntu_base_digest }}
        run: bash tools/resolve_build_inputs.sh >> "${GITHUB_OUTPUT}"

      - name: Compute local image tag
        run: |
          set -euo pipefail
          tag_suffix='${{ inputs.image_tag_suffix }}'
          if [ -z "${tag_suffix}" ]; then
            tag_suffix="${GITHUB_SHA}"
          fi
          echo "IMAGE_REF=local/pgsql-custom:amd64-${tag_suffix}" >> "${GITHUB_ENV}"

      - name: Build linux/amd64 image without pushing
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          push: false
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha,scope=pgsql-source-amd64
          cache-to: type=gha,mode=max,scope=pgsql-source-amd64
          build-args: |
            POSTGRES_SOURCE_REF=${{ steps.build_inputs.outputs.source_ref }}
            POSTGRES_SOURCE_REVISION=${{ steps.build_inputs.outputs.source_revision }}
            POSTGRES_UPSTREAM_VERSION=${{ steps.build_inputs.outputs.upstream_version }}
            POSTGRES_IMAGE_VERSION=${{ steps.build_inputs.outputs.upstream_version }}-local
            POSTGRES_UPSTREAM_DIGEST=${{ steps.build_inputs.outputs.upstream_digest }}
            GOSU_SOURCE_REF=${{ steps.build_inputs.outputs.gosu_source_ref }}
            GOSU_SOURCE_REVISION=${{ steps.build_inputs.outputs.gosu_source_revision }}
            GO_TOOLCHAIN_VERSION=${{ steps.build_inputs.outputs.go_toolchain_version }}
            GO_TOOLCHAIN_SHA256=${{ steps.build_inputs.outputs.go_toolchain_sha256 }}
            ENTRYPOINT_SOURCE_COMMIT=${{ steps.build_inputs.outputs.entrypoint_source_commit }}
            UBUNTU_BASE_IMAGE=${{ steps.build_inputs.outputs.ubuntu_base_ref }}
            UBUNTU_BASE_DIGEST=${{ steps.build_inputs.outputs.ubuntu_base_digest }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            CACHEBUST=${{ github.run_id }}

      - name: Resolve Trivy patch release
        id: trivy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bash scripts/trivy/resolve-version.sh)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "- Trivy: ${version}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Scan candidate with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          version: v${{ steps.trivy.outputs.version }}
          cache: false
          format: json
          output: trivy-report-candidate-amd64.json
          scanners: vuln
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Upload candidate Trivy report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: trivy-candidate-amd64-${{ github.run_id }}
          path: trivy-report-candidate-amd64.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run PostgreSQL integration test
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: bash tests/test-postgres-image.sh

      - name: Show container logs on test failure
        if: failure()
        run: |
          docker ps -a --filter 'name=postgres-image-test-' --format '{{.Names}}' \
            | xargs -r -n1 docker logs --tail 200 || true
